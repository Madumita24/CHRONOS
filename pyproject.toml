[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-datahub-gate"
version = "0.1.0"
description = "Read-only DataHub connection and capability gate for CHRONOS-DEMO-001"
requires-python = ">=3.10"
dependencies = [
  "acryl-datahub==1.6.0.15",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
